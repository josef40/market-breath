<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sveriges mest etablerade kattmarknad. Hitta din nya bästa vän hos oss!">
    <title>Market Breath</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Indicies in relation to key moving averages</h1>

        <div class="actions">
            <button id="updateButton">Update</button>
        </div>

        <div class="ma-toggles" id="maToggles">
            <label class="ma-toggle">
                <input type="checkbox" value="10" checked>
                <span class="ma-dot ma-10"></span>
                10 MA
            </label>
            <label class="ma-toggle">
                <input type="checkbox" value="20" checked>
                <span class="ma-dot ma-20"></span>
                20 MA
            </label>
            <label class="ma-toggle">
                <input type="checkbox" value="50" checked>
                <span class="ma-dot ma-50"></span>
                50 MA
            </label>
        </div>

        <section id="charts"></section>

        <table id="marketTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>SPY</th>
                    <th>QQQ</th>
                    <th>IWM</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </main>
</body>

</html>
